name: Weekly Windsor permit scrape

on:
  schedule:
    - cron: "15 11 * * 1"   # Mondays 11:15 UTC = 7:15 a.m. Windsor (EDT)
  workflow_dispatch: {}      # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python windsor_permits.py

      - name: Commit updated data
        run: |
          git config user.name "permit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ state.json
          git diff --staged --quiet || git commit -m "Weekly permit update $(date -u +%F)"
          git push
